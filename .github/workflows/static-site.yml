name: directory-listing
on:
  push:
    branches:
      - main

jobs:
  pages-directory-listing:
    runs-on: ubuntu-slim
    name: GH Pages by Directory Listing
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main    # checkout branch

      - name: Set env var to pass in file commit dates
        run: echo FILE_DATES="$(for f in $(git ls-files site/**)"; do git --no-pager log -1 --date=short --pretty=format:"$f|%ci!" -- $f ; done) >> $GITHUB_ENV

      - name: Generate Directory Listings
        uses: dieseltravis/github-pages-directory-listing@dieseltravis-html
        with:
          FOLDER: site      # directory to generate index for
          FILE_DATES: ${{ env.FILE_DATES }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'data'      # upload generated folder
  
  deploy:
    needs: pages-directory-listing
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: ubuntu-slim
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
